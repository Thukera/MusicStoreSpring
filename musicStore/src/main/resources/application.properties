#Configuracoes de acesso ao Banco de dados H2
#https://docs.spring.io/spring-boot/docs/2.7.x/reference/html/application-properties.html

# Server Configuration
server.port=7090

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:musicstore
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# H2 Console (optional - useful for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization (Spring Boot 2.5+)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Defer datasource initialization (needed for Hibernate + SQL scripts)
spring.jpa.defer-datasource-initialization=true
